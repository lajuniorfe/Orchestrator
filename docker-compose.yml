version: '3.9'

services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  users-api:
    build:
      context: ../Fiap-UsersApi
      dockerfile: Users.Api/Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - rabbitmq

  catalog-api:
    build:
      context: ../Fiap-CatalogApi/Catalogo.Api
    ports:
      - "5002:8080"
    depends_on:
      - rabbitmq

  payments-api:
    build:
      context: ../Fiap-PaymentsApi/Payments.Api
    ports:
      - "5003:8080"
    depends_on:
      - rabbitmq

  notifications-api:
    build:
      context: ../Fiap-NotificationsApi/NotificationsApi
    ports:
      - "5004:8080"
    depends_on:
      - rabbitmq